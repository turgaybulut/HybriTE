[project]
name = "hybrite"
version = "2.0.0"
description = "HybriTE: a graph-based multimodal project for endogenous TE prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lightgbm",
  "lightning",
  "matplotlib",
  "numpy",
  "pandas",
  "pyyaml",
  "scipy",
  "scikit-learn",
  "torch",
  "torch-geometric",
  "tqdm",
  "rich",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hybrite*"]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["N803", "N806"]
